name: VN100 nightly accumulation scan

on:
  schedule:
    # 20:07 UTC Mon-Fri = 03:07 Asia/Ho_Chi_Minh Tue-Sat.
    # This covers the five Vietnamese market sessions while avoiding the
    # busiest top-of-hour GitHub Actions scheduling window.
    - cron: "7 20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: Scan mode
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - bootstrap
          - dry-run
      notify:
        description: Send new candidates to Telegram
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: vn100-nightly-production
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: Asia/Ho_Chi_Minh
      SCAN_TIMEZONE: Asia/Ho_Chi_Minh
      SCAN_API_SOURCES: ${{ vars.SCAN_API_SOURCES || 'KBS,VCI' }}
      SCAN_SOURCE_REQUESTS_PER_MINUTE: ${{ vars.SCAN_SOURCE_REQUESTS_PER_MINUTE || '20' }}
      SCAN_SOURCE_LIMITS: ${{ vars.SCAN_SOURCE_LIMITS || 'KBS=20,VCI=20,DNSE=15' }}
      SCAN_SOURCE_USAGE_RATIO: ${{ vars.SCAN_SOURCE_USAGE_RATIO || '0.78' }}
      SCAN_REQUEST_JITTER_MIN_SEC: ${{ vars.SCAN_REQUEST_JITTER_MIN_SEC || '1.25' }}
      SCAN_REQUEST_JITTER_MAX_SEC: ${{ vars.SCAN_REQUEST_JITTER_MAX_SEC || '3.75' }}
      SCAN_SOURCE_ERROR_COOLDOWN_MIN_SEC: ${{ vars.SCAN_SOURCE_ERROR_COOLDOWN_MIN_SEC || '30' }}
      SCAN_SOURCE_ERROR_COOLDOWN_MAX_SEC: ${{ vars.SCAN_SOURCE_ERROR_COOLDOWN_MAX_SEC || '120' }}
      SCAN_SOURCE_RECOVER_AFTER_SEC: ${{ vars.SCAN_SOURCE_RECOVER_AFTER_SEC || '300' }}
      SCAN_RETRY_AFTER_MAX_SEC: ${{ vars.SCAN_RETRY_AFTER_MAX_SEC || '300' }}
      SCAN_MAX_WORKERS: ${{ vars.SCAN_MAX_WORKERS || '2' }}
      SCAN_STARTUP_JITTER_MAX_SEC: ${{ vars.SCAN_STARTUP_JITTER_MAX_SEC || '180' }}
      SCAN_DATABASE_PATH: data/vn100_ohlcv.sqlite
      SCAN_OUTPUT_DIR: artifacts/live_scan/latest
      SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'incremental' }}
      SCAN_NOTIFY: ${{ github.event_name == 'schedule' || inputs.notify }}
      THIUCUBU_ENABLED: "1"
      THIUCUBU_MAX_AGE_DAYS: "3"
      THIUCUBU_ENFORCE: "0"
      AI_REVIEW_ENABLED: "1"
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Restore incremental OHLCV state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/vn100_ohlcv.sqlite
          key: vn100-state-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vn100-state-v1-${{ runner.os }}-

      - name: Validate VNStock production secret
        if: env.SCAN_MODE != 'dry-run'
        shell: bash
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          if [[ -z "$VNSTOCK_API_KEY" ]]; then
            printf '::error::Missing GitHub Actions secret: VNSTOCK_API_KEY\n'
            exit 2
          fi

      - name: Validate Telegram production secrets
        if: env.SCAN_MODE != 'dry-run' && env.SCAN_NOTIFY == 'true'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=()
          [[ -n "$TELEGRAM_BOT_TOKEN" ]] || missing+=("TELEGRAM_BOT_TOKEN")
          [[ -n "$TELEGRAM_CHAT_ID" ]] || missing+=("TELEGRAM_CHAT_ID")
          if (( ${#missing[@]} )); then
            printf '::error::Missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 2
          fi

      - name: Validate configuration
        run: python -m scanner.run_vn100_nightly_scan --validate-config

      - id: scan_notify
        name: Download, scan, and notify
        if: env.SCAN_NOTIFY == 'true' && env.SCAN_MODE != 'dry-run'
        shell: bash
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          runtime_home="$(mktemp -d "$RUNNER_TEMP/vnstock-home.XXXXXX")"
          case "$runtime_home" in
            "$RUNNER_TEMP"/vnstock-home.*) ;;
            *) printf '::error::Unsafe temporary HOME path\n'; exit 2 ;;
          esac
          cleanup() { rm -rf -- "$runtime_home"; }
          trap cleanup EXIT
          export HOME="$runtime_home"
          python -m scanner.run_vn100_nightly_scan \
            --mode "$SCAN_MODE" \
            --startup-jitter

      - id: scan_no_notify
        name: Download and scan without notification
        if: env.SCAN_NOTIFY != 'true' || env.SCAN_MODE == 'dry-run'
        shell: bash
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          runtime_home="$(mktemp -d "$RUNNER_TEMP/vnstock-home.XXXXXX")"
          case "$runtime_home" in
            "$RUNNER_TEMP"/vnstock-home.*) ;;
            *) printf '::error::Unsafe temporary HOME path\n'; exit 2 ;;
          esac
          cleanup() { rm -rf -- "$runtime_home"; }
          trap cleanup EXIT
          export HOME="$runtime_home"
          python -m scanner.run_vn100_nightly_scan \
            --mode "$SCAN_MODE" \
            --startup-jitter \
            --no-notify \
            --no-gemini

      - name: Save newest verified state
        if: always() && hashFiles('artifacts/live_scan/latest/state_verified.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/vn100_ohlcv.sqlite
          key: vn100-state-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vn100-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/live_scan/latest/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish deterministic pattern feed
        if: success() && hashFiles('artifacts/live_scan/latest/pattern_feed_latest.json') != ''
        shell: bash
        run: |
          mkdir -p data
          cp artifacts/live_scan/latest/pattern_feed_latest.json data/pattern_feed_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pattern_feed_latest.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update deterministic pattern feed"
          git push
